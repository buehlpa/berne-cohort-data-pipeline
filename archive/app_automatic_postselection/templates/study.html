<!DOCTYPE html>
<html>
<head>
    <title>Sequences</title>
</head>
<body>
    <h1>Sequences for Study {{ study_id }}</h1>
    <ul>
        {% if sequences %}
            {% for sequence in sequences %}
                <li><a href="/sequence/{{ patient_id }}/{{ study_id }}/{{ sequence }}">{{ sequence }}</a></li>
            {% endfor %}
        {% else %}
            <p>No sequences found for this study.</p>
        {% endif %}
    </ul>
</body>
</html>
