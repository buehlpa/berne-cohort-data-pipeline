<!DOCTYPE html>
<html>
<head>
    <title>Sequence Viewer</title>
</head>
<body>
    <h1>Sequence: {{ sequence }}</h1>
    <div id="viewer">
        <img id="nifti-image" src="" alt="NIfTI Slice" style="min-width: 300px; min-height: 300px; max-width: 100%; max-height: 100%;">
        <input type="range" id="slice-slider" min="0" max="{{ num_slices - 1 }}" value="0" onchange="loadSlice(this.value)">
    </div>
    <div id="buttons">
        <button onclick="addSequence('dwi')" style="background-color: red; color: white;">Add to DWI</button>
        <button onclick="addSequence('t1')" style="background-color: green; color: white;">Add to T1</button>
        <button onclick="addSequence('other')" style="background-color: orange; color: white;">Add to Other</button>
        <a href="/index"><button>Back to Patient Selection</button></a>
    </div>
    <div id="metadata">
        <h2>NIfTI Metadata:</h2>
        <pre id="metadata-content"></pre>
    </div>

    <!-- JavaScript Section -->
    <script>
        function loadSlice(index) {
            fetch("/nifti_slice", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    patient_id: "{{ patient_id }}",
                    study_id: "{{ study_id }}",
                    sequence: "{{ sequence }}",
                    slice_index: index
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.image_data) {
                    document.getElementById("nifti-image").src = data.image_data;
                } else {
                    document.getElementById("nifti-image").alt = "No Image Data Available";
                }
                if (data.metadata) {
                    const metadataElement = document.getElementById("metadata-content");
                    metadataElement.textContent = JSON.stringify(data.metadata, null, 2);
                } else if (data.error) {
                    alert(data.error);
                }
            });
        }

        function addSequence(category) {
            fetch("/add_sequence", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    patient_id: "{{ patient_id }}",
                    sequence: "{{ sequence }}",
                    category: category,
                }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.message) {
                    alert(data.message);
                } else if (data.error) {
                    alert(`Error: ${data.error}`);
                }
            })
            .catch(error => {
                alert(`Error: ${error}`);
            });
        }
        loadSlice(0);
    </script>
</body>
</html>
